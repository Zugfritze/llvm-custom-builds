name: Build

on: [push]

jobs:
  build:
    name: Build
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      llvm_version: 23.1.3
      dwarfs_version: 0.15.8
      mkdwarfs_options: "--categorize=binary --chmod=ugo=rx"

    steps:
      - name: Set derived env
        shell: pwsh
        run: |
          "llvm_file_name=clang+llvm-${{ env.llvm_version }}-x86_64-pc-windows-msvc" >> $env:GITHUB_ENV
          "dwarfs_universal_name=dwarfs-universal-${{ env.dwarfs_version }}-Windows-AMD64" >> $env:GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download DwarFS
        uses: robinraju/release-downloader@v1
        with:
          repository: mhx/dwarfs
          tag: v${{ env.dwarfs_version }}
          fileName: ${{ env.dwarfs_universal_name }}.exe

      - name: Checkout LLVM
        uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          ref: llvmorg-${{ env.llvm_version }}
          path: llvm

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download Bootstrap LLVM
        uses: robinraju/release-downloader@v1
        with:
          repository: llvm/llvm-project
          tag: llvmorg-${{ env.llvm_version }}
          fileName: ${{ env.llvm_file_name }}.tar.xz

      - name: Build
        shell: pwsh
        run: |
          New-Item -Path "release" -Force -ItemType "directory"
          7z x ${{ env.llvm_file_name }}.tar.xz
          7z x ${{ env.llvm_file_name }}.tar
          $env:PATH = (Resolve-Path "${{ env.llvm_file_name }}").Path + "\bin" + ";" + $env:PATH
          ./build.ps1
          ./${{ env.dwarfs_universal_name }}.exe --tool=mkdwarfs -i install -o release/llvm.dwarfs ${{ env.mkdwarfs_options }}
          ./${{ env.dwarfs_universal_name }}.exe --tool=mkdwarfs -i ${{ env.llvm_file_name }} -o release/bootstrap_llvm.dwarfs ${{ env.mkdwarfs_options }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release LLVM: ${{ env.llvm_version }} DwarFS: ${{ env.dwarfs_version }}"
          tag_name: ${{ env.llvm_version }}
          files: release/*
